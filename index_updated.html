<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>屋上、焼いてかない？</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#090d16;color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;min-height:100vh;display:grid;place-items:center;padding:0}
.game{width:min(1100px,100vw);background:#111827;overflow:hidden;box-shadow:0 20px 70px #0009}
.top{height:42px;padding:10px 16px;background:#111827;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#cbd5e1}
.title{font-weight:800;color:#fff;letter-spacing:.04em}
.stage{position:relative;width:100%;aspect-ratio:16/9;min-height:260px;max-height:72vh;background:#253044;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:none}
.bg.active{display:block}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#0003 100%);pointer-events:none}
.dialogue-wrap{position:absolute;left:3%;right:3%;bottom:3%;}
.name{display:none;position:relative;z-index:1;width:max-content;max-width:100%;padding:7px 22px;background:#17213aee;border:1px solid #dbeafe;border-bottom:0;border-radius:10px 10px 0 0;font-weight:800;font-size:clamp(13px,2vw,17px);box-shadow:0 2px 8px #0005}
.box{min-height:100px;padding:18px 24px 20px;background:#10172bea;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 4px 18px #0008;position:relative;display:flex;align-items:center}
.box.with-name{border-top-left-radius:0}
.text{font-size:clamp(16px,2.5vw,25px);line-height:1.75;white-space:pre-wrap;padding-right:24px}
.next{position:absolute;right:15px;bottom:13px;border:0;background:transparent;color:#fff;font-size:27px;line-height:1;cursor:pointer;padding:4px 8px}
.next:hover{color:#93c5fd}
.choices{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.choice{border:1px solid #e2e8f0;border-radius:10px;padding:11px 20px;background:#f8fafc;color:#111827;font-weight:800;font-size:16px;cursor:pointer}
.choice:hover{background:#bfdbfe}
.hint{font-size:12px;color:#94a3b8;padding:9px 15px 12px}
@media(max-width:600px){.top{height:36px;padding:8px 11px}.stage{aspect-ratio:4/3;min-height:320px;max-height:none}.box{min-height:100px;padding:14px 16px 19px}.dialogue-wrap{left:3%;right:3%;bottom:3%}.text{font-size:16px}}
</style>
</head>

    <div class="shade"></div>
    <div class="dialogue-wrap">
      <div id="name" class="name"></div>
      <div id="box" class="box">
        <div id="text" class="text">今日は憧れの田所先輩の家に遊びに行く日だ。</div>
        <button id="next" class="next" aria-label="次へ">▸</button>

</main>
<script>
const scenes = [
  {bg:"street", chapter:"プロローグ", name:"", text:"今日は憧れの田所先輩の家に遊びに行く日だ。"},
  {bg:"walk", chapter:"道中", name:"田所先輩", text:"行く時には結構行くねー。"},
  {bg:"door", chapter:"到着", name:"", text:"先輩と話していたら家に着いた。"},
  {bg:"door", chapter:"先輩の家", name:"田所先輩", text:"こ↑こ↓、入ってどうぞ"}
];
let index = 0;
const $ = id => document.getElementById(id);
function render() {
  const s = scenes[index];
  ["street","walk","door"].forEach(id => $(id).classList.toggle("active", id === s.bg));
  $("chapter").textContent = s.chapter;
  $("name").textContent = s.name;
  $("name").style.display = s.name ? "block" : "none";
  $("text").textContent = s.text;
  $("box").classList.toggle("with-name", !!s.name);
  $("next").style.display = index < scenes.length - 1 ? "block" : "none";
  $("choices").replaceChildren();
  if (index === scenes.length - 1) {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = "続きへ";
    b.onclick = () => {
      $("chapter").textContent = "屋上への誘い";
      $("name").style.display = "block";
      $("name").textContent = "田所先輩";
      $("text").textContent = "まずうちさぁ、屋上あんだけどぉ、焼いてかない？";
      $("next").style.display = "none";
      $("choices").replaceChildren();
      const yes = document.createElement("button");
      yes.className = "choice";
      yes.textContent = "する";
      yes.onclick = () => {
        $("chapter").textContent = "つづく";
        $("name").style.display = "none";
        $("text").textContent = "Aは「する」と答え、田所先輩と屋上へ向かうことにした……。";
        $("choices").replaceChildren();
        const restart = document.createElement("button");
        restart.className = "choice";
        restart.textContent = "最初から";
        restart.onclick = () => { index = 0; render(); };
        $("choices").appendChild(restart);
      };
      const no = document.createElement("button");
      no.className = "choice";
      no.textContent = "しない";
      no.onclick = () => {
        $("chapter").textContent = "ゲームオーバー";
        $("name").style.display = "block";
        $("name").textContent = "田所先輩";
        $("text").textContent = "ファッ？！お前やりませんねぇスギィ！MURはん、こいつやっちゃいましょうよ！";
        $("next").style.display = "block";
        $("next").onclick = () => {
          $("name").textContent = "MUR";
          $("text").textContent = "おっそうだな";
          $("next").style.display = "none";
          $("choices").replaceChildren();
          const end = document.createElement("button");
          end.className = "choice";
          end.textContent = "GAME OVER（最初から）";
          end.onclick = () => { index = 0; render(); };
          $("choices").appendChild(end);
        };
        $("choices").replaceChildren();
      };
      $("choices").append(yes, no);
    };
    $("choices").appendChild(b);
  }
}
$("next").addEventListener("click", () => { if(index < scenes.length - 1) { index++; render(); } });
render();
</script>
